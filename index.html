<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MONKz WIRE — Premium Access</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='180 150 390 450'%3E%3Crect x='180' y='150' width='390' height='450' fill='%23080203'/%3E%3Cpolygon points='228,212 525,162 532,192 432,328 438,272 312,290' fill='%23ff3b3b'/%3E%3Cpolygon points='193,235 440,448 200,372' fill='%23ff8a8a'/%3E%3Cpolygon points='320,305 548,372 556,495 430,440' fill='%23b01212'/%3E%3Cpolygon points='322,425 550,520 225,585 215,575' fill='%23e02424'/%3E%3C/svg%3E">
<meta name="theme-color" content="#0a0304">
<style>
:root{--bg:#070203;--red:#ff2e2e;--deep:#7a0b0b;--line:rgba(255,80,80,.18);--mut:#a98b8b;--u:clamp(14px,.52vw + 9px,30px)}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:var(--u)}
body{background:var(--bg);color:#f4eaea;font-family:'Inter',system-ui,'Segoe UI',sans-serif;min-height:100vh;display:grid;place-items:center;overflow:hidden}
#fx{position:fixed;inset:0;pointer-events:none}
.glow{position:fixed;width:60vw;height:60vw;left:50%;top:50%;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(255,40,40,.24),transparent 60%);filter:blur(30px);pointer-events:none;animation:pulse 6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.55}}
.topbar{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:1rem 1.6rem;z-index:5}
.tb{display:flex;align-items:center;gap:.6rem;font-weight:800;letter-spacing:.22em;font-size:.85rem}
.tb b{color:var(--red)}
.tb svg{width:2rem;height:2rem;filter:drop-shadow(0 0 .5rem rgba(255,40,40,.7))}
.buy{display:inline-flex;align-items:center;gap:.5rem;padding:.55rem 1.2rem;border-radius:2rem;background:linear-gradient(135deg,var(--red),var(--deep));color:#fff;text-decoration:none;font-size:.72rem;font-weight:800;letter-spacing:.18em;box-shadow:0 0 1.6rem rgba(255,46,46,.5);transition:.25s;animation:bp 2.4s ease-in-out infinite}
.buy:hover{transform:translateY(-2px)}
@keyframes bp{50%{box-shadow:0 0 2.6rem rgba(255,46,46,.85)}}
.card{position:relative;z-index:2;width:min(26rem,92vw);padding:2.2rem 2rem;text-align:center;background:linear-gradient(160deg,rgba(255,255,255,.07),rgba(255,255,255,.015));border:1px solid var(--line);border-radius:1.2rem;backdrop-filter:blur(18px);box-shadow:0 0 4rem rgba(255,30,30,.12)}
.logo{width:5.2rem;height:5.2rem;filter:drop-shadow(0 0 1.2rem rgba(255,40,40,.8))}
.card h1{margin:1rem 0 .2rem;font-size:1.5rem;letter-spacing:.35em;font-weight:800}
.card h1 span{color:var(--red)}
.card p{color:var(--mut);font-size:.8rem;margin-bottom:1.4rem}
input{width:100%;padding:.85rem 1rem;background:rgba(0,0,0,.45);border:1px solid var(--line);border-radius:.7rem;color:#fff;font-size:.9rem;letter-spacing:.2em;text-align:center;outline:none;transition:.25s}
input:focus{border-color:var(--red);box-shadow:0 0 1.2rem rgba(255,46,46,.35)}
.btn{width:100%;margin-top:.9rem;padding:.85rem;border:0;border-radius:.7rem;cursor:pointer;font-weight:700;letter-spacing:.2em;font-size:.8rem;color:#fff;background:linear-gradient(135deg,var(--red),var(--deep));box-shadow:0 0 1.5rem rgba(255,46,46,.4);transition:.25s}
.btn:hover{transform:translateY(-2px);box-shadow:0 0 2.6rem rgba(255,46,46,.7)}
.err{min-height:1rem;margin-top:.7rem;font-size:.72rem;color:#ff7b7b;font-weight:700;letter-spacing:.08em;line-height:1.7}
.err a{color:#fff;text-decoration:underline}
.err .du{color:var(--red);font-weight:500;letter-spacing:.03em}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.hint{margin-top:1rem;font-size:.68rem;color:#6e5555}
.gbuy{display:block;margin-top:.8rem;font-size:.7rem;color:var(--mut);text-decoration:none;letter-spacing:.1em}
.gbuy b{color:var(--red)}
</style>
</head>
<body>
<canvas id="fx"></canvas><div class="glow"></div>
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="lg" viewBox="180 150 390 450">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff"/><stop offset=".25" stop-color="#ff8a80"/><stop offset="1" stop-color="#c41212"/></linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffe3e0"/><stop offset=".5" stop-color="#ff4a4a"/><stop offset="1" stop-color="#8a0c0c"/></linearGradient>
    <linearGradient id="g3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c81818"/><stop offset="1" stop-color="#4a0505"/></linearGradient>
    <linearGradient id="g4" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e83a3a"/><stop offset="1" stop-color="#7a0909"/></linearGradient>
  </defs>
  <polygon points="228,212 525,162 532,192 432,328 438,272 312,290" fill="url(#g1)"/>
  <polygon points="310,278 436,262 432,282 312,298" fill="#fff" opacity=".85"/>
  <polygon points="193,235 440,448 200,372" fill="url(#g2)"/>
  <polygon points="320,305 548,372 556,495 430,440" fill="url(#g3)" stroke="#ff4d4d" stroke-width="2"/>
  <polygon points="322,425 550,520 225,585 215,575" fill="url(#g4)" stroke="#ff6b6b" stroke-width="2"/>
</symbol></defs></svg>

<div class="topbar">
  <div class="tb"><svg><use href="#lg"/></svg><span>MONKz<b>WIRE</b></span></div>
  <a class="buy buyl" target="_blank" rel="noopener">🛒 BUY PANEL</a>
</div>

<form class="card" id="f" autocomplete="off">
  <svg class="logo"><use href="#lg"/></svg>
  <h1>MONKz<span> WIRE</span></h1>
  <p>Enter your key to unlock the panel</p>
  <input id="pw" type="password" placeholder="MONK-FFH4X-XXXX" autofocus>
  <button class="btn" type="submit">UNLOCK ACCESS</button>
  <div class="err" id="err"></div>
  <a class="gbuy buyl" target="_blank" rel="noopener">Don't have a key? <b>BUY PANEL</b></a>
</form>

<script>
/* ===== EDIT THESE ===== */
var KEY_PREFIX     = "MONK-FFH4X";   /* any key starting with this unlocks */
var DISCORD_URL    = "https://discord.gg/gZGJFyWUU";
var NEXT_PAGE      = "/main.html";
/* ====================== */
var $=function(i){return document.getElementById(i)};
function sset(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function sget(k){try{return localStorage.getItem(k)}catch(e){return null}}
Array.prototype.forEach.call(document.querySelectorAll('.buyl'),function(a){a.href='/store.html';a.removeAttribute('target')});
if(sget('ff_ok')==='1')location.replace(NEXT_PAGE);
$('f').addEventListener('submit',function(e){
  e.preventDefault();
  if($('pw').value.trim().toUpperCase().indexOf(KEY_PREFIX.toUpperCase())===0){sset('ff_ok','1');location.href=NEXT_PAGE}
  else{$('err').innerHTML='WRONG KEY — <a href="/store.html">BUY A KEY</a><br><a class="du" href="'+DISCORD_URL+'" target="_blank" rel="noopener">'+DISCORD_URL+'</a>';var f=$('f');f.classList.remove('shake');void f.offsetWidth;f.classList.add('shake');$('pw').value=''}
});
var c=$('fx'),x=c.getContext('2d'),W,H,P=[];
function rs(){var d=Math.min(window.devicePixelRatio||1,2);W=c.width=innerWidth*d;H=c.height=innerHeight*d;P=[];for(var i=0;i<Math.floor(innerWidth/14);i++)P.push({x:Math.random()*W,y:Math.random()*H,r:(Math.random()*1.8+.4)*d,v:(Math.random()*.4+.1)*d})}
addEventListener('resize',rs);rs();
(function loop(){x.clearRect(0,0,W,H);P.forEach(function(p){p.y-=p.v;if(p.y<0){p.y=H;p.x=Math.random()*W}x.beginPath();x.arc(p.x,p.y,p.r,0,7);x.fillStyle='rgba(255,60,60,.55)';x.fill()});requestAnimationFrame(loop)})();
</script>
</body>
</html>
