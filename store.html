<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MONKz WIRE — Store</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='180 150 390 450'%3E%3Crect x='180' y='150' width='390' height='450' fill='%23080203'/%3E%3Cpolygon points='228,212 525,162 532,192 432,328 438,272 312,290' fill='%23ff3b3b'/%3E%3Cpolygon points='193,235 440,448 200,372' fill='%23ff8a8a'/%3E%3Cpolygon points='320,305 548,372 556,495 430,440' fill='%23b01212'/%3E%3Cpolygon points='322,425 550,520 225,585 215,575' fill='%23e02424'/%3E%3C/svg%3E">
<meta name="theme-color" content="#0a0304">
<style>
:root{--bg:#070203;--red:#ff2e2e;--deep:#7a0b0b;--line:rgba(255,80,80,.18);--mut:#a98b8b;--u:clamp(14px,.52vw + 9px,30px)}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:var(--u)}
body{background:var(--bg);color:#f4eaea;font-family:'Inter',system-ui,'Segoe UI',sans-serif;min-height:100vh;overflow-x:hidden}
#fx{position:fixed;inset:0;pointer-events:none;z-index:0}
.glow{position:fixed;width:70vw;height:70vw;left:50%;top:30%;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(255,40,40,.22),transparent 60%);filter:blur(30px);pointer-events:none;animation:pulse 6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.55}}
.topbar{position:relative;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:1rem clamp(1rem,3vw,3rem)}
.tb{display:flex;align-items:center;gap:.6rem;font-weight:800;letter-spacing:.22em;font-size:.85rem;text-decoration:none;color:inherit}
.tb b{color:var(--red)}
.tb svg{width:2rem;height:2rem;filter:drop-shadow(0 0 .5rem rgba(255,40,40,.7))}
.back{color:var(--mut);text-decoration:none;font-size:.75rem;letter-spacing:.12em;padding:.5rem 1rem;border:1px solid var(--line);border-radius:2rem;transition:.2s}
.back:hover{color:#fff;border-color:var(--red)}
main{position:relative;z-index:2;max-width:80rem;margin:0 auto;padding:1.5rem clamp(1rem,3vw,3rem) 4rem}
.hero{text-align:center;margin-bottom:2.2rem}
.hero h1{font-size:clamp(1.6rem,3vw,2.4rem);letter-spacing:.3em;font-weight:800}
.hero h1 span{color:var(--red)}
.hero p{color:var(--mut);font-size:.85rem;margin-top:.6rem}
.plans{display:grid;grid-template-columns:repeat(auto-fit,minmax(14rem,1fr));gap:1.1rem}
.plan{position:relative;padding:1.6rem 1.3rem;text-align:center;background:linear-gradient(160deg,rgba(255,255,255,.06),rgba(255,255,255,.012));border:1px solid var(--line);border-radius:1.1rem;backdrop-filter:blur(14px);transition:.3s;display:flex;flex-direction:column}
.plan:hover{transform:translateY(-6px);border-color:rgba(255,70,70,.65);box-shadow:0 0 2.5rem rgba(255,30,30,.25)}
.plan.hot{border-color:rgba(255,60,60,.7);box-shadow:0 0 2.2rem rgba(255,30,30,.22)}
.badge{position:absolute;top:-.65rem;left:50%;transform:translateX(-50%);padding:.25rem .8rem;border-radius:2rem;background:linear-gradient(135deg,var(--red),var(--deep));font-size:.6rem;font-weight:800;letter-spacing:.15em;white-space:nowrap}
.plan h3{font-size:.8rem;letter-spacing:.3em;color:var(--mut);font-weight:700}
.price{font-size:2.3rem;font-weight:800;margin:.7rem 0 .2rem}
.price em{font-style:normal;color:var(--red);font-size:1.3rem;vertical-align:top;margin-right:.1rem}
.per{font-size:.68rem;color:var(--mut);letter-spacing:.1em}
ul{list-style:none;margin:1.2rem 0;text-align:left;font-size:.78rem;flex:1}
li{padding:.45rem 0;border-bottom:1px solid rgba(255,255,255,.05);color:#d9c4c4}
li::before{content:"✔";color:var(--red);margin-right:.6rem}
li:last-child{border:0}
.buyb{display:block;width:100%;padding:.8rem;border:0;border-radius:.7rem;cursor:pointer;font-weight:800;letter-spacing:.2em;font-size:.75rem;color:#fff;background:linear-gradient(135deg,var(--red),var(--deep));box-shadow:0 0 1.4rem rgba(255,46,46,.4);transition:.25s}
.buyb:hover{box-shadow:0 0 2.6rem rgba(255,46,46,.8);transform:translateY(-2px)}
.note{text-align:center;margin-top:2rem;color:var(--mut);font-size:.78rem;line-height:1.8}
.note a{color:var(--red);text-decoration:none;font-weight:700}
#toast{position:fixed;left:50%;bottom:1.5rem;transform:translate(-50%,10px);z-index:50;padding:.8rem 1.3rem;border:1px solid var(--line);border-radius:.7rem;background:rgba(15,4,5,.96);font-size:.78rem;opacity:0;transition:.3s;pointer-events:none}
#toast.s{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<canvas id="fx"></canvas><div class="glow"></div>
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="lg" viewBox="180 150 390 450">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff"/><stop offset=".25" stop-color="#ff8a80"/><stop offset="1" stop-color="#c41212"/></linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffe3e0"/><stop offset=".5" stop-color="#ff4a4a"/><stop offset="1" stop-color="#8a0c0c"/></linearGradient>
    <linearGradient id="g3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c81818"/><stop offset="1" stop-color="#4a0505"/></linearGradient>
    <linearGradient id="g4" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e83a3a"/><stop offset="1" stop-color="#7a0909"/></linearGradient>
  </defs>
  <polygon points="228,212 525,162 532,192 432,328 438,272 312,290" fill="url(#g1)"/>
  <polygon points="310,278 436,262 432,282 312,298" fill="#fff" opacity=".85"/>
  <polygon points="193,235 440,448 200,372" fill="url(#g2)"/>
  <polygon points="320,305 548,372 556,495 430,440" fill="url(#g3)" stroke="#ff4d4d" stroke-width="2"/>
  <polygon points="322,425 550,520 225,585 215,575" fill="url(#g4)" stroke="#ff6b6b" stroke-width="2"/>
</symbol></defs></svg>

<div class="topbar">
  <a class="tb" href="/index.html"><svg><use href="#lg"/></svg><span>MONKz<b>WIRE</b></span></a>
  <a class="back" href="/index.html">← HAVE A KEY? UNLOCK</a>
</div>

<main>
  <div class="hero">
    <h1>MONKz<span> WIRE</span> STORE</h1>
    <p>Choose your plan — click BUY and complete your order on Discord</p>
  </div>
  <div class="plans" id="plans"></div>
  <div class="note">Click <b>BUY</b> to open our Discord, create a ticket and send your plan name.<br>
    Need help? <a id="dc" target="_blank" rel="noopener"></a></div>
</main>
<div id="toast"></div>

<script>
/* ===== EDIT THESE ===== */
var DISCORD_URL = "https://discord.gg/gZGJFyWUU";
var CURRENCY    = "₹";
/* name, price, badge (optional), perks */
var PLANS = [
  {name:"1 DAY",    price:99,   per:"for 24 hours", perks:["Full panel access","All hacks unlocked","Instant key on Discord"]},
  {name:"3 DAYS",   price:199,  per:"for 3 days",   perks:["Full panel access","All hacks unlocked","Instant key on Discord"]},
  {name:"7 DAYS",   price:349,  per:"for 7 days",   badge:"POPULAR", perks:["Full panel access","All hacks unlocked","Priority support"]},
  {name:"30 DAYS",  price:799,  per:"for 30 days",  perks:["Full panel access","All hacks unlocked","Priority support","Free updates"]},
  {name:"LIFETIME", price:1499, per:"one-time payment", badge:"BEST VALUE", perks:["Full panel access","All hacks unlocked","VIP support","Lifetime updates"]}
];
/* ====================== */
var $=function(i){return document.getElementById(i)};
$('dc').href=DISCORD_URL;$('dc').textContent=DISCORD_URL;
function toast(t){var el=$('toast');el.textContent=t;el.classList.add('s');setTimeout(function(){el.classList.remove('s')},2200)}
var h='';
PLANS.forEach(function(p,i){
  h+='<div class="plan'+(p.badge?' hot':'')+'">'+(p.badge?'<div class="badge">'+p.badge+'</div>':'')+
  '<h3>'+p.name+'</h3><div class="price"><em>'+CURRENCY+'</em>'+p.price+'</div><div class="per">'+p.per+'</div><ul>'+
  p.perks.map(function(k){return '<li>'+k+'</li>'}).join('')+'</ul><button class="buyb" data-i="'+i+'">BUY NOW</button></div>';
});
$('plans').innerHTML=h;
$('plans').addEventListener('click',function(e){
  var b=e.target.closest('.buyb');if(!b)return;
  var p=PLANS[+b.dataset.i],msg='I want to buy MONKz WIRE '+p.name+' ('+CURRENCY+p.price+')';
  try{navigator.clipboard.writeText(msg)}catch(err){}
  toast('Opening Discord… order text copied');
  setTimeout(function(){window.open(DISCORD_URL,'_blank')||(location.href=DISCORD_URL)},700);
});

var c=$('fx'),x=c.getContext('2d'),W,H,P=[];
function rs(){var d=Math.min(window.devicePixelRatio||1,2);W=c.width=innerWidth*d;H=c.height=innerHeight*d;P=[];for(var i=0;i<Math.floor(innerWidth/14);i++)P.push({x:Math.random()*W,y:Math.random()*H,r:(Math.random()*1.8+.4)*d,v:(Math.random()*.4+.1)*d})}
addEventListener('resize',rs);rs();
(function loop(){x.clearRect(0,0,W,H);P.forEach(function(p){p.y-=p.v;if(p.y<0){p.y=H;p.x=Math.random()*W}x.beginPath();x.arc(p.x,p.y,p.r,0,7);x.fillStyle='rgba(255,60,60,.55)';x.fill()});requestAnimationFrame(loop)})();
</script>
</body>
</html>
